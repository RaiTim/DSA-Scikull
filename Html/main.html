<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../Style/main.css">
    <title>Advance Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
    <script src="../Controllers/mainNew.js"></script>
    <link rel="stylesheet" href="../Style/floating-math.css">
    <script src="../Controllers/floating-math.js"></script>
</head>
<body>

<div id="start-screen" class="start-screen">
    <button id="start-btn" class="start-button">Start Calculator</button>
</div>

<div id="calculator-screen" class="main-container hidden">

    <div class="window">
        <button id="exitBtn" value="O" onclick="getNumber(event)" class="button number-button absolute-value-btn">Exit</button>
        <label id="output">-</label>
        <h1 id="myInput">0</h1>
    </div>

    <div class="button-container">
        <button value="AC" onclick="getNumber(event)" class="button number-button">C</button>
        <button value="Del" onclick="getNumber(event)" class="button number-button">←</button>
        <button value="%" onclick="getNumber(event)" class="button">%</button>
        <button value="-" onclick="getNumber(event)" class="button">-</button>
    </div>

    <div class="button-container">
        <button value="7" onclick="getNumber(event)" class="button number-button">7</button>
        <button value="8" onclick="getNumber(event)" class="button number-button">8</button>
        <button value="9" onclick="getNumber(event)" class="button number-button">9</button>
        <button value="+" onclick="getNumber(event)" class="button">+</button>
    </div>

    <div class="button-container">
        <button value="4" onclick="getNumber(event)" class="button number-button">4</button>
        <button value="5" onclick="getNumber(event)" class="button number-button">5</button>
        <button value="6" onclick="getNumber(event)" class="button number-button">6</button>
        <button value="÷" onclick="getNumber(event)" class="button">÷</button>
    </div>

    <div class="button-container">
        <button value="1" onclick="getNumber(event)" class="button number-button">1</button>
        <button value="2" onclick="getNumber(event)" class="button number-button">2</button>
        <button value="3" onclick="getNumber(event)" class="button number-button">3</button>
        <button value="×" onclick="getNumber(event)" class="button">×</button>
    </div>

    <div class="button-container">
        <button value="R" onclick="getNumber(event)" class="button">R</button>
        <button value="0" onclick="getNumber(event)" class="button number-button">0</button>
        <button value="Max" onclick="getNumber(event)" class="button">▲</button>
        <button value="Min" onclick="getNumber(event)" class="button">▼</button>
    </div>
    
    <div class="button-container">
        <button value="⌈x⌉" onclick="getNumber(event)" class="button">⌈x⌉</button>
        <button value="⌊x⌋" onclick="getNumber(event)" class="button">⌊x⌋</button>
        <button value="." onclick="getNumber(event)" class="button">.</button>
        <button value="," onclick="getNumber(event)" class="button">,</button>
    </div>

    <div class="button-container">
        <button value="√x" onclick="getNumber(event)" class="button">√x</button>
        <button value="∛x" onclick="getNumber(event)" class="button">∛x</button>
        <button value="x²" onclick="getNumber(event)" class="button">x²</button>
        <button value="xʸ" onclick="getNumber(event)" class="button">xʸ</button>
    </div>

    <div class="button-container">
        <button value="(" onclick="getNumber(event)" class="button">(</button>
        <button value=")" onclick="getNumber(event)" class="button">)</button>
        <button value="AV" onclick="getNumber(event)" class="button">AV</button>
        <button value="=" onclick="getNumber(event)" class="button">=</button>
    </div>
</div>

</body>
</html>
